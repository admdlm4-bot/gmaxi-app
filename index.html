<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmaxi AI</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-card { width: 100%; max-width: 450px; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { margin: 0; color: #1a73e8; font-size: 24px; }
        .header p { margin: 5px 0 0; color: #5f6368; font-size: 13px; }
        #chat-box { height: 320px; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; overflow-y: auto; background-color: #f8f9fa; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background-color: #1a73e8; color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #e8f0fe; color: #202124; align-self: flex-end; border-bottom-left-radius: 2px; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 14px; }
        button.send-btn { padding: 12px 18px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .social-bar { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .social-btn { flex: 1; text-align: center; text-decoration: none; color: white; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .yt { background-color: #ff0000; }
        .fb { background-color: #1877f2; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>Gmaxi AI 🤖</h1>
        <p>المساعد الذكي الشخصي</p>
    </div>

    <!-- صندوق الدردشة مع النموذج اللغوي الكبير -->
    <div id="chat-box"></div>

    <!-- حقل الإدخال -->
    <div class="input-group">
        <input type="text" id="user-input" placeholder="اسأل الذكاء الاصطناعي شيئاً...">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <!-- أزرار التواصل الاجتماعي (يوتيوب وفيسبوك) -->
    <div class="social-bar">
        <a href="https://www.youtube.com" target="_blank" class="social-btn yt">يوتيوب 📺</a>
        <a href="https://www.facebook.com" target="_blank" class="social-btn fb">فيسبوك 📘</a>
    </div>
</div>

<script>
    // ضع مفتاح الـ API الخاص بك هنا بين علامتي التنصيص
    const API_KEY = "ضع_مفتاح_API_هنا";

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const text = input.value.trim();

        if (!text) return;

        chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'msg ai-msg';
        loadingDiv.innerText = 'جاري التفكير...';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                loadingDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                loadingDiv.innerText = 'حدث خطأ أو أن المفتاح غير صحيح، يرجى التأكد منه.';
            }
        } catch (err) {
            loadingDiv.innerText = 'خطأ في الاتصال بالشبكة.';
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
  </html>
